<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Update Agent</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>Website Update Agent</h1><p>Government, education & exam website monitoring</p></div><div><button onclick="openAdd()">+ Add Website</button> <button onclick="scanAll()">Scan All</button></div></header><section><h2>Overview</h2><div id="stats"></div></section><section id="addBox" class="hidden"><h2>Add New Website</h2><form id="siteForm" onsubmit="addWebsite(event)"><div class="formgrid"><label>Name<input id="name" required placeholder="e.g. BPSC"></label><label>Website URL<input id="url" type="url" required placeholder="https://example.gov.in"></label><label>Monitor Type<select id="monitor_type"><option value="html">HTML</option><option value="rss">RSS / Atom</option><option value="pdf">PDF</option><option value="playwright">JavaScript</option></select></label><label>Scan Interval (minutes)<input id="interval" type="number" min="1" value="30" required></label><label>Priority<select id="priority"><option>HIGH</option><option selected>MEDIUM</option><option>LOW</option></select></label><label>CSS Selector<input id="selector" placeholder="Optional: .notice-list"></label><label>RSS URL<input id="rss_url" type="url" placeholder="Optional"></label><label>Keywords<input id="keywords" placeholder="result, admit card, recruitment"></label><label>Excluded Keywords<input id="excluded_keywords" placeholder="Optional"></label></div><div class="checks"><label><input id="enabled" type="checkbox" checked> Enabled</label><label><input id="js_render" type="checkbox"> JavaScript render</label><label><input id="pdf_monitor" type="checkbox"> Monitor PDFs</label><label><input id="notify_telegram" type="checkbox" checked> Telegram alerts</label><label><input id="notify_email" type="checkbox"> Email alerts</label></div><button type="submit">Save Website</button> <button type="button" class="secondary" onclick="closeAdd()">Cancel</button></form></section><section><h2>Websites</h2><div id="sites"></div></section><section><h2>Latest Updates</h2><div id="updates"></div></section></main><script src="app.js"></script></body></html>
